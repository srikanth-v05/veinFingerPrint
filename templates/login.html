{% extends "base.html" %}

{% block title %}Admin Login | VeinTrace{% endblock %}
{% block page_id %}login{% endblock %}

{% block content %}
<main class="single-panel-layout">
  <section class="panel auth-panel">
    <p class="eyebrow">Admin Access</p>
    <h1>Manage enrollments</h1>
    <p class="lead">Use the admin dashboard to add or remove finger-vein users.</p>

    {% if error %}
    <div class="flash error">{{ error }}</div>
    {% endif %}

    <form action="{{ url_for('admin_login_post') }}" method="post" class="stack-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>
        <span>Username</span>
        <input type="text" name="username" autocomplete="username" required>
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="primary-button">Login</button>
    </form>
  </section>
</main>
{% endblock %}
